  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#475569" stroke-width="2" />
  <!-- Horizontal atmospheric haze bands parting around the sheltered corridor -->
  <path d="M10 21 H25 M39 21 H54" stroke="url(#mist)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M8 32 H21 M43 32 H56" stroke="url(#mist)" stroke-width="4" stroke-linecap="round" />
  <path d="M11 43 H24 M40 43 H53" stroke="url(#mist)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Sheltered canopy halo -->
  <path d="M21 50 C21 37, 43 31, 43 16" stroke="#064e3b" stroke-width="11" stroke-linecap="round" opacity="0.65" />
  <!-- Protected route corridor cutting through the haze -->
