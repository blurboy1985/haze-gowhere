<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c252c" />
      <stop offset="55%" stop-color="#26323b" />
      <stop offset="100%" stop-color="#332b24" />
    </linearGradient>
    <linearGradient id="mist" x1="6" y1="32" x2="58" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="path" x1="20" y1="52" x2="44" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
