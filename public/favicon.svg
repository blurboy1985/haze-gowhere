  <!-- Starting Point & Destination nodes -->
  <circle cx="21" cy="50" r="4.5" fill="#f8fafc" stroke="#059669" stroke-width="2.5" />
  <circle cx="43" cy="16" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
